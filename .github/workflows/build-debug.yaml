name: Build Debug

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore cached TDLib
        uses: actions/cache@v4
        with:
          path: tdlib-cache/libtdjson.so
          key: tdlib-master-arm64-v4

      - name: Place TDLib into jniLibs (when cached)
        run: |
          if [ -f tdlib-cache/libtdjson.so ]; then
            mkdir -p app/src/main/jniLibs/arm64-v8a
            cp tdlib-cache/libtdjson.so app/src/main/jniLibs/arm64-v8a/
            ls -la app/src/main/jniLibs/arm64-v8a/
          else
            echo "TDLib not cached yet; building the shell without it"
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Verify pinned test signing certificate
        run: |
          python3 - <<'EOF'
          import zipfile, struct, hashlib, sys
          path = "app/build/outputs/apk/debug/app-debug.apk"
          data = open(path, "rb").read()
          # APK Signing Block lives just before the ZIP central directory.
          eocd = data.rfind(b"PK\x05\x06")
          cd_off = struct.unpack_from("<I", data, eocd + 16)[0]
          magic = data[cd_off - 16:cd_off]
          assert magic == b"APK Sig Block 42", magic
          block_size = struct.unpack_from("<Q", data, cd_off - 24)[0]
          block_start = cd_off - block_size - 8
          pos = block_start + 8
          end = cd_off - 24
          def field(buf, off):
              ln = struct.unpack_from("<I", buf, off)[0]
              return buf[off + 4:off + 4 + ln], off + 4 + ln
          certs = []
          while pos < end:
              pair_len = struct.unpack_from("<Q", data, pos)[0]
              pair_id = struct.unpack_from("<I", data, pos + 8)[0]
              if pair_id == 0x7109871a:  # v2 signature block
                  v2 = data[pos + 12:pos + 8 + pair_len]
                  signers, _ = field(v2, 0)
                  signer, off = field(signers, 0)
                  signed_data, off2 = field(signer, 0)
                  digests, off3 = field(signed_data, 0)
                  cert_field, _ = field(signed_data, off3)
                  cert, _ = field(cert_field, 0)
                  certs.append(hashlib.sha256(cert).hexdigest())
              pos += 8 + pair_len
          print("certs:", certs)
          assert certs == ["06ffef1ef532d569ec2f9a178c5638ab7cdf57309d98783b91946c79ed87a6a6"], certs
          print("test signing certificate OK")
          EOF

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tuxungram-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
