name: Build Release

# Slim package workflow (v0.9.0, H3): builds the release
# variant (R8 + resource shrinking + compressed native
# library). Dispatched manually so the per-push debug builds
# stay as they are.
#
# Signing modes (v0.9.7, Q1) — the "Prepare signing" step
# decides from which repository secrets are configured:
#   formal : all four signing secrets are set
#            (TUXUNGRAM_KEYSTORE_BASE64,
#            TUXUNGRAM_KEYSTORE_PASSWORD, TUXUNGRAM_KEY_ALIAS,
#            TUXUNGRAM_KEY_PASSWORD) AND both API secrets
#            (TUXUNGRAM_API_ID / TUXUNGRAM_API_HASH). The
#            keystore is decoded to a temp path, the build
#            signs with the formal release key, and the verify
#            step asserts the formal certificate fingerprint
#            B7:3A:20:80:...:45:13. This is the v1.0.0 route.
#   test   : none of the four signing secrets is set. The
#            build falls back to the pinned test certificate
#            and the verify step asserts it (06ffef1e...).
#            This is how the slim test packages are produced.
#   partial: some but not all signing secrets are set -> the
#            run FAILS immediately, listing the missing ones.
#            A package must never silently come out signed
#            differently from what the operator intended.
# The run summary states the mode and the certificate
# fingerprint in plain language.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore cached TDLib
        uses: actions/cache@v4
        with:
          path: tdlib-cache/libtdjson.so
          key: tdlib-master-arm64-v4

      - name: Place TDLib into jniLibs (when cached)
        run: |
          if [ -f tdlib-cache/libtdjson.so ]; then
            mkdir -p app/src/main/jniLibs/arm64-v8a
            cp tdlib-cache/libtdjson.so app/src/main/jniLibs/arm64-v8a/
            ls -la app/src/main/jniLibs/arm64-v8a/
          else
            echo "TDLib not cached yet; building the shell without it"
          fi

      - name: Prepare signing
        env:
          KS_B64: ${{ secrets.TUXUNGRAM_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.TUXUNGRAM_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TUXUNGRAM_KEY_ALIAS }}
          KEY_PW: ${{ secrets.TUXUNGRAM_KEY_PASSWORD }}
          API_ID: ${{ secrets.TUXUNGRAM_API_ID }}
          API_HASH: ${{ secrets.TUXUNGRAM_API_HASH }}
        run: |
          missing=""
          [ -z "$KS_B64" ] && missing="$missing TUXUNGRAM_KEYSTORE_BASE64"
          [ -z "$KS_PW" ] && missing="$missing TUXUNGRAM_KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ] && missing="$missing TUXUNGRAM_KEY_ALIAS"
          [ -z "$KEY_PW" ] && missing="$missing TUXUNGRAM_KEY_PASSWORD"
          if [ -z "$missing" ]; then
            api_missing=""
            [ -z "$API_ID" ] && api_missing="$api_missing TUXUNGRAM_API_ID"
            [ -z "$API_HASH" ] && api_missing="$api_missing TUXUNGRAM_API_HASH"
            if [ -n "$api_missing" ]; then
              echo "::error::Formal signing secrets are configured but the API credential secrets are missing:$api_missing. A formally signed package must not ship with the temporary fallback API credentials. Fill the missing secrets and re-run."
              exit 1
            fi
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/tuxungram-release.keystore"
            test -s "$RUNNER_TEMP/tuxungram-release.keystore"
            {
              echo "SIGNING_MODE=formal"
              echo "TUXUNGRAM_KEYSTORE_PATH=$RUNNER_TEMP/tuxungram-release.keystore"
              echo "TUXUNGRAM_STORE_PASSWORD=$KS_PW"
              echo "TUXUNGRAM_KEY_ALIAS=$KEY_ALIAS"
              echo "TUXUNGRAM_KEY_PASSWORD=$KEY_PW"
              echo "TUXUNGRAM_API_ID=$API_ID"
              echo "TUXUNGRAM_API_HASH=$API_HASH"
            } >> "$GITHUB_ENV"
            echo "Signing mode: FORMAL (repository release key + project API credentials)"
          elif [ "$missing" = " TUXUNGRAM_KEYSTORE_BASE64 TUXUNGRAM_KEYSTORE_PASSWORD TUXUNGRAM_KEY_ALIAS TUXUNGRAM_KEY_PASSWORD" ]; then
            echo "SIGNING_MODE=test" >> "$GITHUB_ENV"
            if [ -n "$API_ID" ]; then echo "TUXUNGRAM_API_ID=$API_ID" >> "$GITHUB_ENV"; fi
            if [ -n "$API_HASH" ]; then echo "TUXUNGRAM_API_HASH=$API_HASH" >> "$GITHUB_ENV"; fi
            echo "Signing mode: TEST (pinned test certificate; no signing secrets configured)"
          else
            echo "::error::Signing secrets are only partially configured. Missing:$missing. Fill all four signing secrets for a formal package, or remove all four for a test package."
            exit 1
          fi

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signing certificate
        run: |
          python3 - <<'EOF'
          import os, zipfile, struct, hashlib, sys
          mode = os.environ.get("SIGNING_MODE", "test")
          expected = {
              "formal": "b73a2080f93b8433f4ade626082b0902f0564e260da28ea070bc3433ca5b4513",
              "test": "06ffef1ef532d569ec2f9a178c5638ab7cdf57309d98783b91946c79ed87a6a6",
          }[mode]
          path = "app/build/outputs/apk/release/app-release.apk"
          data = open(path, "rb").read()
          # APK Signing Block lives just before the ZIP central directory.
          eocd = data.rfind(b"PK\x05\x06")
          cd_off = struct.unpack_from("<I", data, eocd + 16)[0]
          magic = data[cd_off - 16:cd_off]
          assert magic == b"APK Sig Block 42", magic
          block_size = struct.unpack_from("<Q", data, cd_off - 24)[0]
          block_start = cd_off - block_size - 8
          pos = block_start + 8
          end = cd_off - 24
          def field(buf, off):
              ln = struct.unpack_from("<I", buf, off)[0]
              return buf[off + 4:off + 4 + ln], off + 4 + ln
          certs = []
          while pos < end:
              pair_len = struct.unpack_from("<Q", data, pos)[0]
              pair_id = struct.unpack_from("<I", data, pos + 8)[0]
              if pair_id == 0x7109871a:  # v2 signature block
                  v2 = data[pos + 12:pos + 8 + pair_len]
                  signers, _ = field(v2, 0)
                  signer, off = field(signers, 0)
                  signed_data, off2 = field(signer, 0)
                  digests, off3 = field(signed_data, 0)
                  cert_field, _ = field(signed_data, off3)
                  cert, _ = field(cert_field, 0)
                  certs.append(hashlib.sha256(cert).hexdigest())
              pos += 8 + pair_len
          print("signing mode:", mode)
          print("certs:", certs)
          assert certs == [expected], certs
          print(mode + " signing certificate OK")
          EOF

      - name: Signing summary
        run: |
          {
            echo "## Signing"
            if [ "$SIGNING_MODE" = "formal" ]; then
              echo "- Mode: **formal** — signed with the repository release key."
              echo "- Certificate SHA-256: B7:3A:20:80:F9:3B:84:33:F4:AD:E6:26:08:2B:09:02:F0:56:4E:26:0D:A2:8E:A0:70:BC:34:33:CA:5B:45:13 (asserted by the verify step)."
              echo "- API credentials: the project's own TUXUNGRAM_API_ID / TUXUNGRAM_API_HASH."
            else
              echo "- Mode: **test** — signed with the pinned TEST certificate. This package is NOT a formal release."
              echo "- Certificate SHA-256: 06:FF:EF:1E:F5:32:D5:69:EC:2F:9A:17:8C:56:38:AB:7C:DF:57:30:9D:98:78:3B:91:94:6C:79:ED:87:A6:A6 (asserted by the verify step)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: tuxungram-release-apk
          path: app/build/outputs/apk/release/app-release.apk
